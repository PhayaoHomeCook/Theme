name: Build Phayao Home Cook Android Theme APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Accept Android SDK Licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Build PhayaoHomeCookTheme.apk
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk PhayaoHomeCookTheme.apk
          elif [ -f "android-icon-pack/settings.gradle.kts" ]; then
            cd android-icon-pack
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../PhayaoHomeCookTheme.apk
          else
            echo "ERROR: Could not find settings.gradle.kts"
            find . -maxdepth 3
            exit 1
          fi
      - name: Upload PhayaoHomeCookTheme.apk
        uses: actions/upload-artifact@v4
        with:
          name: PhayaoHomeCookTheme-APK
          path: PhayaoHomeCookTheme.apk
          retention-days: 90
